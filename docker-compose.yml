services:
  postgres:
    image: postgres:16-alpine
    container_name: oci_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oci_panel}
      POSTGRES_USER: ${POSTGRES_USER:-oci_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-OciPanelSecPass998!}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - oci_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oci_admin} -d ${POSTGRES_DB:-oci_panel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oci_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-OciRedisPass998!}
    volumes:
      - redis_data:/data
    networks:
      - oci_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-OciRedisPass998!}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oci_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_PORT=8080
      - APP_ENV=production
      - DB_DSN=postgres://${POSTGRES_USER:-oci_admin}:${POSTGRES_PASSWORD:-OciPanelSecPass998!}@postgres:5432/${POSTGRES_DB:-oci_panel}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-OciRedisPass998!}
      - MASTER_KEY=${MASTER_KEY:-SuperMasterSecretKey32BytesLong!}
      - ALLOWED_IPS=${ALLOWED_IPS:-}
      # Proxies whose X-Real-IP header is trusted (default: docker private ranges = the nginx container)
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # A1 allowances enforced by the zero-cost guard: free tenancy 2 OCPU / 12 GB, upgraded PAYG 4 OCPU / 24 GB
      - FREE_A1_OCPU=${FREE_A1_OCPU:-2}
      - FREE_A1_MEMORY_GB=${FREE_A1_MEMORY_GB:-12}
      - PAYG_A1_OCPU=${PAYG_A1_OCPU:-4}
      - PAYG_A1_MEMORY_GB=${PAYG_A1_MEMORY_GB:-24}
      - FREE_STORAGE_GB=${FREE_STORAGE_GB:-200}
      - FREE_MICRO_COUNT=${FREE_MICRO_COUNT:-2}
      - TZ=${TZ:-Asia/Tokyo}
      - NAME_TIMEZONE=${NAME_TIMEZONE:-Asia/Tokyo}
      - RETRY_MAX_DAYS=${RETRY_MAX_DAYS:-7}
      - RETRY_MAX_LAUNCHES_PER_DAY=${RETRY_MAX_LAUNCHES_PER_DAY:-30}
      - CAPACITY_POLL_MIN_SECS=${CAPACITY_POLL_MIN_SECS:-180}
      - CAPACITY_POLL_MAX_SECS=${CAPACITY_POLL_MAX_SECS:-300}
    volumes:
      - ~/.oci:/root/.oci:ro
      - app_data:/app/data
    networks:
      - oci_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oci_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8000:80"
    networks:
      - oci_internal

  # Cloudflare Tunnel (optional, zero public ports). Not started unless the "tunnel" profile is on.
  # Easiest: run  ./tunnel.sh <token>  — it writes CLOUDFLARE_TUNNEL_TOKEN and COMPOSE_PROFILES=tunnel
  # into .env and starts this container. In Cloudflare, point the public hostname to  frontend:80 (HTTP).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: oci_cloudflared
    restart: always
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # Passed as an env var so the token never shows up in `docker ps` / process lists
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
    networks:
      - oci_internal

networks:
  oci_internal:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  app_data:
